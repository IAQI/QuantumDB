# Production stack — use explicitly:  docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the dev docker-compose.yml:
#   * No pgAdmin, and Postgres is NOT published to the host (only the app container
#     reaches it over the internal network).
#   * The app is published to 127.0.0.1 only — put a TLS-terminating reverse proxy
#     (e.g. Caddy) in front of it; nothing here is exposed to the public internet directly.
#   * Secrets (POSTGRES_PASSWORD, API_TOKENS) are REQUIRED — compose errors if unset.
#     Put them in a gitignored .env file on the server (next to this file).
#   * Production hardening flags: TRUST_PROXY, strict CORS, Swagger disabled, no AUTH_DISABLED.
services:
  app:
    build: .
    # Loopback-only: only the host's reverse proxy can reach the app.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgres://quantumdb:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/quantumdb
      - RUST_LOG=info
      # Required: comma-separated API tokens (generate with ./tools/generate_token.sh).
      - API_TOKENS=${API_TOKENS:?set API_TOKENS in .env}
      # Behind a reverse proxy → key the rate limiter on X-Forwarded-For.
      - TRUST_PROXY=1
      # Allowed browser origins for the public read API; e.g. https://quantumdb.example.org
      # Leave unset to disallow all cross-origin browser requests.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Hide the OpenAPI spec + Swagger UI in production.
      - ENABLE_SWAGGER=0
      # NOTE: AUTH_DISABLED is intentionally absent — never enable it in production.
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    # No published ports — Postgres is reachable only from the app container.
    environment:
      - POSTGRES_USER=quantumdb
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=quantumdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./migrations:/migrations:ro
      - ./seeds:/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumdb -d quantumdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
