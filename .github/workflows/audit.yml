name: Security audit

# Runs `cargo audit` against Cargo.lock to catch known RustSec advisories in
# the dependency tree. Dependabot only surfaced a subset of these (see commit
# c3962d8), so this gives fuller, push-and-schedule coverage.

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  # Weekly run catches newly-disclosed advisories against unchanged deps — the
  # exact gap that let the stale sqlx alert linger.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Ignored advisories (revisit when a fix ships):
      #   RUSTSEC-2023-0071 — rsa Marvin timing attack. No patched version
      #     exists, and it is only reachable via sqlx-mysql, which this project
      #     does not compile (sqlx is built with the postgres feature only).
      # The rand unsoundness items (RUSTSEC-2026-0097) are informational
      # warnings, not vulnerabilities, so they surface in the log without
      # failing the job.
      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071
